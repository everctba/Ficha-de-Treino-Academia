<!DOCTYPE html>
<html class="dark" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <title>Ficha de Treino - Graciele Personal Trainer</title>

    <!-- PWA -->
    <meta name="description"
        content="Gerador de fichas de treino em PDF da Graciele Personal Trainer. Funciona offline e pode ser instalado no celular." />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Ficha de Treino" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- Captura o evento de instalação o quanto antes (Chrome/Edge/Android) -->
    <script>
        window.__pwaInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function (event) {
            event.preventDefault();
            window.__pwaInstallPrompt = event;
            window.dispatchEvent(new Event('pwa-installable'));
        });
    </script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&amp;family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;family=Roboto+Condensed:wght@300;400;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "gra-gold": "#C5A96F",
                        "gra-gold-light": "#E3C98D",
                        "gra-gold-dark": "#9E844F",
                        "gra-black": "#0A0A0A",
                        "gra-dark-gray": "#161616",
                        "gra-gray": "#2A2A2A",
                        "gra-text-white": "#F5F5F5",
                        "gra-text-muted": "#A0A0A0",
                    },
                    fontFamily: {
                        "display": ["Playfair Display", "serif"],
                        "body": ["Montserrat", "sans-serif"],
                        "condensed": ["Roboto Condensed", "sans-serif"],
                    },
                    backgroundImage: {
                        'gold-gradient': 'linear-gradient(135deg, #C5A96F 0%, #E3C98D 50%, #9E844F 100%)',
                    }
                },
            },
        }
    </script>

    <!-- Custom Style extensions (Scrollbar, Input Override) -->
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #050505;
        }



        .form-input-custom {
            transition: all 0.3s ease;
            border-radius: 4px;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .form-input-custom:focus {
            border-bottom-color: #C5A96F;
            box-shadow: none;
            outline: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0A0A0A;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #C5A96F;
        }

        .text-shadow-gold {
            text-shadow: 0px 2px 4px rgba(197, 169, 111, 0.2);
        }

        /* PWA: aviso de nova versão */
        .pwa-toast {
            position: fixed;
            left: 50%;
            bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: calc(100% - 2rem);
            max-width: 26rem;
            padding: 0.75rem 0.75rem 0.75rem 1rem;
            border: 1px solid rgba(197, 169, 111, 0.45);
            border-radius: 0.75rem;
            background: rgba(22, 22, 22, 0.98);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(197, 169, 111, 0.12);
            color: #F5F5F5;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            transform: translate(-50%, 150%);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .pwa-toast.is-visible {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        .pwa-toast-text {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
            font-weight: 500;
        }

        .pwa-toast-icon {
            color: #C5A96F;
            font-size: 1.25rem;
        }

        .pwa-toast-button {
            flex-shrink: 0;
            padding: 0.55rem 0.9rem;
            border-radius: 9999px;
            background: linear-gradient(135deg, #C5A96F 0%, #E3C98D 50%, #9E844F 100%);
            color: #0A0A0A;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .pwa-toast-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }
    </style>

    <link rel="stylesheet" href="style.css"> <!-- PDF styles loaded here -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body class="bg-gra-black text-gra-text-white min-h-screen flex flex-col selection:bg-gra-gold selection:text-black">

    <!-- Header -->
    <header class="sticky top-0 z-50 w-full border-b border-white/10 bg-gra-black/90 backdrop-blur-md">
        <div class="mx-auto flex h-20 max-w-md items-center justify-between px-6">
            <div class="flex items-center">
                <img src="logo-gra-horizontal.png" alt="Graciele Personal Trainer" class="h-10 w-auto object-contain">
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-install" type="button" title="Instalar aplicativo" aria-label="Instalar aplicativo"
                    style="display: none;"
                    class="flex h-9 w-9 items-center justify-center rounded-full border border-gra-gold/40 bg-gra-gold/10 text-gra-gold transition-all hover:scale-110 hover:border-gra-gold hover:bg-gra-gold/20 active:scale-95">
                    <span class="material-symbols-outlined text-xl">install_mobile</span>
                </button>
                <button onclick="window.location.reload()" title="Recarregar" aria-label="Recarregar"
                    class="flex h-9 w-9 items-center justify-center rounded-full bg-gradient-to-br from-gra-gold to-gra-gold-dark text-gra-black shadow-lg shadow-gra-gold/20 transition-all hover:scale-110 hover:shadow-gra-gold/40 active:scale-95">
                    <span class="material-symbols-outlined text-xl font-bold">refresh</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 px-4 py-8 sm:px-6 relative overflow-hidden" id="app">
        <!-- Decoration BG -->
        <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
            <div class="absolute top-[-10%] right-[-10%] w-[300px] h-[300px] bg-gra-gold/5 rounded-full blur-[80px]">
            </div>
        </div>

        <div class="mx-auto max-w-md space-y-8 relative z-10">

            <!-- Intro / Title -->
            <div class="text-center space-y-2 pb-2">
                <h2 class="text-4xl text-white italic font-bold text-shadow-gold">Ficha de Treino</h2>
                <div class="flex items-center justify-center gap-3">
                    <div class="h-[1px] w-8 bg-gradient-to-r from-transparent to-gra-gold"></div>
                    <p class="text-gra-gold text-xs uppercase tracking-[0.25em] font-medium">Gerador de PDF</p>
                    <div class="h-[1px] w-8 bg-gradient-to-l from-transparent to-gra-gold"></div>
                </div>
            </div>

            <!-- Global Info Card -->
            <div
                class="bg-gra-dark-gray/80 backdrop-blur-sm rounded-xl border border-white/5 p-6 shadow-xl relative overflow-hidden group">
                <div
                    class="absolute top-0 left-0 w-1 h-full bg-gradient-to-b from-gra-gold via-gra-gold-light to-gra-gold-dark">
                </div>
                <div class="space-y-6">
                    <div class="space-y-2">
                        <label
                            class="text-[10px] font-bold uppercase tracking-widest text-gra-gold flex items-center gap-2">
                            <span class="material-symbols-outlined text-sm">person</span> ALUNO(A)
                        </label>
                        <input id="aluno-nome"
                            class="form-input-custom w-full bg-transparent py-2 px-0 text-base text-white placeholder-white/20 font-light caret-gra-gold"
                            type="text" placeholder="Nome completo">
                    </div>
                    <div class="space-y-2">
                        <label
                            class="text-[10px] font-bold uppercase tracking-widest text-gra-gold flex items-center gap-2">
                            <span class="material-symbols-outlined text-sm">fitness_center</span> OBJETIVO / TÍTULO
                        </label>
                        <input id="treino-titulo"
                            class="form-input-custom w-full bg-transparent py-2 px-0 text-xl italic text-white placeholder-white/20 caret-gra-gold"
                            type="text" placeholder="Ex: Hipertrofia">
                    </div>
                </div>
            </div>

            <!-- Dynamic Workouts Container -->
            <div id="workouts-list" class="space-y-8">
                <!-- Javascript will render cards here -->
            </div>

            <!-- Add Workout Button -->
            <button onclick="addTreino()"
                class="group relative flex w-full items-center justify-center gap-2 rounded-lg border border-dashed border-white/20 bg-white/5 py-4 text-gra-text-muted transition-all hover:border-gra-gold hover:bg-gra-gold/10 hover:text-white">
                <span
                    class="material-symbols-outlined text-gra-gold group-hover:scale-110 transition-transform">add_circle</span>
                <span class="font-bold uppercase tracking-widest text-xs">Adicionar Treino (A, B...)</span>
            </button>

            <!-- Recommendations -->
            <div class="space-y-4 pt-4">
                <h3 class="text-xl text-white italic font-bold flex items-center gap-3">
                    <span class="w-8 h-[1px] bg-gra-gold"></span> Observações
                </h3>
                <div class="relative bg-gra-dark-gray/50 rounded-xl border border-white/10 p-1">
                    <textarea id="recomendacoes"
                        class="w-full bg-transparent text-white placeholder-gra-text-muted/40 p-4 focus:outline-none resize-none border border-transparent focus:border-gra-gold/50 focus:ring-1 focus:ring-gra-gold rounded-lg text-sm font-light leading-relaxed caret-gra-gold transition-all"
                        placeholder="Recomendações finais..." rows="3"></textarea>
                    <div class="absolute bottom-2 right-2 text-gra-gold/50">
                        <span class="material-symbols-outlined text-sm">edit_note</span>
                    </div>
                </div>
            </div>

            <!-- Generate PDF Button -->
            <div class="sticky bottom-6 z-40 mt-8">
                <button id="btn-generate-pdf"
                    class="relative w-full overflow-hidden rounded-full bg-gradient-to-r from-gra-gold-dark via-gra-gold to-gra-gold-dark py-4 text-sm font-bold text-black uppercase tracking-widest shadow-lg shadow-gra-gold/20 transition-transform active:scale-[0.98] hover:shadow-gra-gold/40">
                    <span class="relative z-10 flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined">download</span>
                        Gerar PDF
                    </span>
                    <div
                        class="absolute inset-0 bg-white/20 opacity-0 hover:opacity-100 transition-opacity duration-300">
                    </div>
                </button>
            </div>

            <!-- Debug View of PDF Output -->
            <div class="mt-8 mb-20 space-y-2 max-w-md mx-auto">
                <h3 class="text-white text-center text-xs uppercase tracking-widest opacity-50">Pré-visualização de
                    Exportação (Debug)</h3>
                <!-- Container matches form width -->
                <div id="export-container-wrapper" class="border-2 border-dashed border-red-500/50 rounded-lg">
                    <div id="pdf-content">
                        <div class="pdf-noise-overlay"></div>
                        <img src="grunge-topo.png" class="pdf-grunge-topo" alt="">
                        <!-- Header PDF -->
                        <div class="contorno">
                            <img src="logo-gra.png" class="pdf-logo" alt="Logo Graciele">
                            <img src="fita.png" class="pdf-tape-bg" alt="">
                        </div>
                        <div class="pdf-header">

                            <span class="pdf-header-logo-text">Personal Trainer</span>
                            <div style="position: relative; display: inline-block;">

                                <h1 id="pdf-title">FICHA DE TREINO</h1>
                            </div>
                            <h2 id="pdf-aluno">NOME DO ALUNO</h2>
                            <h3 id="pdf-objetivo">OBJETIVO</h3>
                        </div>
                        <div class="pdf-inner-content">

                            <!-- Content -->
                            <div id="pdf-body"></div>
                            <!-- Footer -->
                            <div class="pdf-footer">
                                <h4>RECOMENDAÇÕES:</h4>
                                <div id="pdf-recs" class="pdf-recs-text"></div>
                            </div>
                            <div class="pdf-watermark-bottom">
                                Whatever It Takes
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <script src="pwa.js"></script>
            <script src="app.js"></script>
</body>

</html>
